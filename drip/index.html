<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>드립 | 남자의 쇼핑은 망설이지 않는다</title>
<meta name="description" content="직접 써 보고 괜찮은 것만 남긴 추천템. 고민은 짧게, 만족은 길게.">
<link rel="canonical" href="https://musetag.kr/drip/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="muse.tag">
<meta property="og:title" content="남자의 쇼핑은 망설이지 않는다 | 드립">
<meta property="og:description" content="직접 써 보고 괜찮은 것만 남긴 추천템. 고민은 짧게, 만족은 길게.">
<meta property="og:url" content="https://musetag.kr/drip/">
<meta name="theme-color" content="#0C0D0B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230C0D0B'/%3E%3Cpath d='M10 9.5H22V24M10 16.5H22' fill='none' stroke='%23C8F53C' stroke-width='4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap&text=%EB%93%9C%EB%A6%BD%EB%A7%81%ED%81%AC%EC%B6%94%EA%B0%80%20">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="drip.css?v=4">
</head>
<body>
<header class="bar">
  <a class="brand" href="./"><span class="brand-logo">드립</span><span class="brand-sub">드립 저장소</span></a>
  <a class="bar-link" href="../">muse.tag</a>
</header>

<main class="main">
  <section class="hero" aria-labelledby="hero-title">
    <p class="kicker">직접 써 본 것만 추천</p>
    <h1 class="hero-title" id="hero-title">남자의 쇼핑은<br><em>망설이지 않는다.</em></h1>
    <p class="hero-sub" id="tagline">써 보고 괜찮은 것만 남겼어요. 고민은 짧게, 만족은 길게.</p>
    <div class="hero-meta">
      <span class="pill" id="m-count" hidden></span>
      <span class="pill" id="m-date" hidden></span>
      <a class="pill" id="handle" hidden></a>
    </div>
  </section>

  <section aria-labelledby="buy-title">
    <div class="sec-head">
      <h2 class="sec-title" id="buy-title">직접 써 본 추천템</h2>
      <span class="count" id="count" hidden></span>
    </div>
    <div class="disclosure" id="disclosure"></div>
    <ol class="items" id="items"></ol>
    <div class="empty" id="empty" hidden>
      <strong>아직 준비 중이에요</strong>
      써 보고 괜찮은 것만 고르는 중이에요. 곧 채워 둘게요.
    </div>
  </section>

  <div id="lucky-slot" hidden></div>

  <section id="follow-sec" aria-labelledby="follow-title" hidden>
    <h2 class="sec-title" id="follow-title">드립 받아보기</h2>
    <ul class="follow" id="follow"></ul>
  </section>
</main>

<footer class="foot">
  <p>드립 저장소 · <a href="../">muse.tag</a></p>
</footer>

<script src="drip.js?v=4"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function show(data) {
    var ch = (data && data.channel) || {};
    var links = (data && data.links) || [];
    var parts = Drip.split(links);

    if (ch.tagline) $('tagline').textContent = ch.tagline;

    var handle = String(ch.handle || '').replace(/^@/, '').trim();
    if (handle) {
      $('handle').textContent = '@' + handle;
      var home = Drip.parse(ch.instagram) || Drip.parse(ch.threads);
      if (home) $('handle').href = home.href; else $('handle').removeAttribute('href');
      $('handle').hidden = false;
    }

    // 랜덤 뽑기 배너
    $('lucky-slot').textContent = '';
    if (parts.random) $('lucky-slot').appendChild(Drip.lucky(parts.random));
    $('lucky-slot').hidden = !parts.random;

    var n = Drip.render($('items'), parts.items, '');
    $('count').textContent = n + '개';
    $('count').hidden = n === 0;
    $('empty').hidden = n > 0;
    $('m-count').textContent = '추천템 ' + n + '개';
    $('m-count').hidden = n === 0;

    // 마지막으로 올린 날
    var last = Drip.valid(links).map(function (l) { return l.added || ''; }).sort().pop();
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(last || '');
    if (m) {
      $('m-date').textContent = Number(m[2]) + '월 ' + Number(m[3]) + '일 업데이트';
      $('m-date').hidden = false;
    }

    var notes = Drip.disclosure(links);
    $('disclosure').textContent = '';
    notes.forEach(function (t) {
      var p = document.createElement('p');
      p.textContent = t;
      $('disclosure').appendChild(p);
    });
    $('disclosure').hidden = notes.length === 0;

    var follow = [];
    if (Drip.parse(ch.instagram)) follow.push(['인스타그램' + (handle ? ' @' + handle : ''), ch.instagram]);
    if (Drip.parse(ch.threads)) follow.push(['Threads' + (handle ? ' @' + handle : ''), ch.threads]);
    $('follow').textContent = '';
    follow.forEach(function (f) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = Drip.parse(f[1]).href;
      a.rel = 'noopener';
      a.textContent = f[0];
      li.appendChild(a);
      $('follow').appendChild(li);
    });
    $('follow-sec').hidden = follow.length === 0;

    // 방문자 수: 채널 정보에 GA 측정 ID 가 있으면 켠다
    Drip.analytics(ch.ga);
  }

  Drip.trackClicks(document);

  fetch('links.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(show)
    .catch(function () { show(null); });
})();
</script>
</body>
</html>
